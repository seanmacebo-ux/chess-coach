name: Deploy to GitHub Pages

# Pages on a free account requires the repository to be public. While the repo
# is private this workflow will build fine but the deploy step will fail on
# permissions — make the repo public (or upgrade the plan) to activate it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a superseded one rather than racing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # prebuild copies the Stockfish WASM out of node_modules into public/sf,
      # which is gitignored — the binary is never committed, only vendored at
      # build time.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
